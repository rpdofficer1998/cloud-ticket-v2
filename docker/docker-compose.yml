services:
  postgres:
    image: postgres:16
    container_name: cloudticket-postgres

    restart: unless-stopped

    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}


    volumes:
      - postgres-data:/var/lib/postgresql/data

  backend:
    build:
      context: ../backend

    container_name: cloudticket-backend

    restart: unless-stopped

    ports:
      - "3000:3000"

    environment:
      DB_HOST: postgres
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_PORT: ${DB_PORT}

    depends_on:
      - postgres

volumes:
  postgres-data:
