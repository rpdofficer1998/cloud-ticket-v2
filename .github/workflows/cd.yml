name: CloudTicket CD

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::312957452590:role/GitHubActionsCloudTicketRole
          aws-region: ap-southeast-2

      - name: Deploy to EC2
        shell: bash
        run: |
          set -e

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids i-059c48b0fafd75b14 \
            --document-name AWS-RunShellScript \
            --parameters 'commands=["sudo -u ssm-user env HOME=/home/ssm-user bash -c '\''cd /home/ssm-user/cloud-ticket && git -c safe.directory=/home/ssm-user/cloud-ticket pull --ff-only origin main && ./scripts/deploy.sh'\''"]' \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          for i in {1..60}; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id i-059c48b0fafd75b14 \
              --query "Status" \
              --output text)

            echo "Attempt $i: $STATUS"

            case "$STATUS" in
              Success)
                echo "Deployment succeeded."
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id i-059c48b0fafd75b14 \
                  --query "StandardOutputContent" \
                  --output text
                exit 0
                ;;
              Failed|Cancelled|TimedOut|Cancelling)
                echo "Deployment failed with status: $STATUS"
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id i-059c48b0fafd75b14 \
                  --query "[Status,StandardErrorContent,StandardOutputContent]" \
                  --output text
                exit 1
                ;;
            esac

            sleep 2
          done

          echo "Deployment did not finish within the expected time."
          exit 1

      - name: Deploy frontend to S3
        run: |
          aws s3 sync frontend/ s3://cloudticket-frontend-jeff211/ \
            --delete \
            --exclude "node_modules/*"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id EKQP2BHDA5VC2 \
            --paths "/*"
