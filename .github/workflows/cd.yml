name: CloudTicket-v2 CD

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-southeast-2
  ECR_REPOSITORY: cloudticket-v2-dev-backend

  # EC2 instances are selected by these tags.
  EC2_PROJECT_TAG: cloudticket-v2
  EC2_ENVIRONMENT_TAG: dev

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Get the source code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Exchange GitHub OIDC token for AWS credentials
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::312957452590:role/cloudticket-v2-dev-github-actions-role
          aws-region: ${{ env.AWS_REGION }}

      # 3. Authenticate Docker with Amazon ECR
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # 4. Build the backend Docker image
      - name: Build Docker image
        run: |
          docker build \
            -t $ECR_REPOSITORY:${{ github.sha }} \
            ./backend

      # 5. Tag the image with the ECR registry address
      - name: Tag Docker image
        run: |
          docker tag \
            $ECR_REPOSITORY:${{ github.sha }} \
            ${{ steps.login-ecr.outputs.registry }}/$ECR_REPOSITORY:${{ github.sha }}

      # 6. Push the image to ECR
      - name: Push Docker image to ECR
        run: |
          docker push \
            ${{ steps.login-ecr.outputs.registry }}/$ECR_REPOSITORY:${{ github.sha }}

      # 7. Deploy the image to private EC2 instances through SSM
      - name: Deploy to EC2 via SSM
        id: deploy-ssm
        run: |
          ECR_REGISTRY="${{ steps.login-ecr.outputs.registry }}"

          COMMAND_ID=$(aws ssm send-command \
            --targets \
              "Key=tag:Project,Values=$EC2_PROJECT_TAG" \
              "Key=tag:Environment,Values=$EC2_ENVIRONMENT_TAG" \
            --document-name "AWS-RunShellScript" \
            --parameters "commands=[
              \"aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $ECR_REGISTRY\",
              \"docker pull $ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }}\",
              \"docker stop cloudticket-backend-v2 || true\",
              \"docker rm cloudticket-backend-v2 || true\",
              \"docker run -d --name cloudticket-backend-v2 -p 3000:3000 $ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }}\"
            ]" \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"
          echo "command-id=$COMMAND_ID" >> "$GITHUB_OUTPUT"

          # Wait for deployment to complete
          for i in {1..60}; do
            STATUS=$(aws ssm list-command-invocations \
              --command-id "$COMMAND_ID" \
              --details \
              --query 'CommandInvocations[].Status' \
              --output text)

            echo "Current status: $STATUS"

            # Fail if any targeted instance fails.
            if echo "$STATUS" | grep -qE 'Failed|Cancelled|TimedOut'; then
              echo "Deployment failed."
              exit 1
            fi

            # Succeed only when all returned invocations are finished.
            if [ -n "$STATUS" ] && \
              ! echo "$STATUS" | grep -qE 'Pending|InProgress'; then
              echo "Deployment completed."
              break
            fi

            sleep 5
          done

          # Make sure the loop did not simply run out of time.
          if echo "$STATUS" | grep -qE 'Pending|InProgress' || [ -z "$STATUS" ]; then
            echo "Deployment timed out or no target instance was found."
            exit 1
          fi

      # 8. Show the result of the deployment command
      - name: Check deployment result
        run: |
          # Show deployment results for all targeted EC2 instances.
          aws ssm list-command-invocations \
            --command-id "${{ steps.deploy-ssm.outputs.command-id }}" \
            --details
