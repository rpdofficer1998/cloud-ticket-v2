name: CloudTicket-v2 CD

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-southeast-2
  ECR_REPOSITORY: cloudticket-v2-dev-backend

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Get the source code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Exchange GitHub OIDC token for AWS credentials
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::312957452590:role/cloudticket-v2-dev-github-actions-role
          aws-region: ${{ env.AWS_REGION }}

      # 3. Authenticate Docker with Amazon ECR
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # 4. Build the backend Docker image
      - name: Build Docker image
        run: |
          docker build \
            -t $ECR_REPOSITORY:${{ github.sha }} \
            ./backend

      # 5. Scan the Docker image for HIGH and CRITICAL vulnerabilities
      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: '${{ env.ECR_REPOSITORY }}:${{ github.sha }}'
          format: 'table'
          severity: 'HIGH,CRITICAL'
          # Ignore vulnerabilities that currently have no available fix.
          # Production environments should define this according to their risk policy.
          ignore-unfixed: true
          exit-code: '1'

      # 6. Tag the image with the ECR registry address
      - name: Tag Docker image
        run: |
          docker tag \
            $ECR_REPOSITORY:${{ github.sha }} \
            ${{ steps.login-ecr.outputs.registry }}/$ECR_REPOSITORY:${{ github.sha }}

      # 7. Push the image to ECR
      - name: Push Docker image to ECR
        run: |
          docker push \
            ${{ steps.login-ecr.outputs.registry }}/$ECR_REPOSITORY:${{ github.sha }}

      # 8. Update the desired backend image version
      - name: Update image tag in SSM Parameter Store
        run: |
          aws ssm put-parameter \
            --name "/cloudticket-v2/dev/image-tag" \
            --value "${{ github.sha }}" \
            --type String \
            --overwrite

      # 9. Start an ASG rolling instance refresh
      - name: Start ASG instance refresh
        id: refresh
        run: |
          set -euo pipefail

          REFRESH_ID=$(aws autoscaling start-instance-refresh \
            --auto-scaling-group-name "cloudticket-v2-dev-asg" \
            --query 'InstanceRefreshId' \
            --output text)

          echo "Instance Refresh ID: $REFRESH_ID"
          echo "refresh-id=$REFRESH_ID" >> "$GITHUB_OUTPUT"

      # 10. Wait for the ASG instance refresh to complete
      - name: Wait for ASG instance refresh
        run: |
          set -euo pipefail

          REFRESH_ID="${{ steps.refresh.outputs.refresh-id }}"

          for i in {1..60}; do
            STATUS=$(aws autoscaling describe-instance-refreshes \
              --auto-scaling-group-name "cloudticket-v2-dev-asg" \
              --instance-refresh-ids "$REFRESH_ID" \
              --query 'InstanceRefreshes[0].Status' \
              --output text)

            echo "Instance Refresh status: $STATUS"

            case "$STATUS" in
              Successful)
                echo "Instance refresh completed successfully."
                exit 0
                ;;
              Failed|Cancelled|RollbackFailed)
                echo "Instance refresh failed."
                exit 1
                ;;
            esac

            sleep 10
          done

          echo "Instance refresh timed out."
          exit 1

      # 11. Deploy frontend files to Amazon S3
      - name: Deploy frontend files to Amazon S3
        run: |
          aws s3 sync ./frontend/ s3://cloudticket-v2-dev-frontend --delete

      # 12. Invalidate CloudFront cache
      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id EJBDE9RXM8R0T \
            --paths "/*"
